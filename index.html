<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yemek Tarif Asistanı</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">
    <!-- Başlık -->
    <header>
      <h1>🍳 Yemek Tarif Asistanı</h1>
      <p class="aciklama">Yasal • Telif haklarına saygılı • Ücretsiz</p>
    </header>

    <!-- Arama Kutusu -->
    <div class="arama-kutusu">
      <input type="text" id="yemekAdi" placeholder="Yemek adı yazın... (ör: patlıcan musakka)">
      <button onclick="tarifGetir()">Tarifi Göster</button>
    </div>

    <!-- Sonuç Alanı (script.js burayı kullanıyor) -->
    <div id="sonuc"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
